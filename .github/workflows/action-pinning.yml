name: Action Pinning

on:
  workflow_dispatch:

jobs:
  audit-pinning:
    runs-on: ubuntu-latest
    steps:
      # Best Practice: Pin to immutable 40-character commit SHA with version comment
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #4.2.2

      - name: Setup Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: '20'

      - name: Verify runtime
        run: node --version